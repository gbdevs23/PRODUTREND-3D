name: Descobrir produtos 3D diariamente

on:
  schedule:
    # 11:00 UTC = 08:00 horário de Brasília (UTC-3).
    # Ajuste esse valor se quiser rodar em outro horário.
    - cron: '0 11 * * *'
  workflow_dispatch: {}  # também permite rodar manualmente pelo botão "Run workflow" no GitHub

permissions:
  contents: write  # necessário para o workflow poder salvar (commitar) os resultados de volta no repositório

jobs:
  descobrir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o descobridor de produtos 3D
        run: python descobrir_produtos_3d.py

      - name: Salvar resultados de volta no repositório
        run: |
          git config user.name "agente-produtos-3d"
          git config user.email "actions@github.com"
          git add historico_candidatos.csv candidatos_*.csv
          git diff --staged --quiet || git commit -m "Descoberta automática de $(date -u +'%Y-%m-%d')"
          git push
